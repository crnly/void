# Only loaded on Void's private tmux server (-L void).
set -g prefix C-b
set -g mouse off
set -g pane-border-style 'fg=#536773'
set -g pane-active-border-style 'fg=#88AABB'
set -g status-style 'fg=#88AABB,bg=default'
set -g status-left ' Void '
set -g status-right 'C-b Left/Right panes | C-b d detach '
set -g status-right-length 60
set -g window-status-format ''
set -g window-status-current-format ''
set -g remain-on-exit off
