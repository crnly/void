name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v tmux >/dev/null; then
            brew install tmux
          fi
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o "$RUNNER_TEMP/void" .
